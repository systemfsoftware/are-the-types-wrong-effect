name: Conflict check (reusable)

on:
  workflow_call:
    inputs:
      base_ref:
        description: Name of the base branch the PR targets (e.g. main); empty on push, where the steps below skip
        required: false
        default: ""
        type: string
      head_sha:
        description: SHA of the PR head commit (never the merge ref); empty on push, where the steps below skip
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        if: inputs.head_sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Detect merge conflicts with base
        if: inputs.head_sha != ''
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Deviation from the reference, whose guard reads its status after if-fi: POSIX makes that always 0, so a conflicted branch passed. This one propagates merge-tree's real exit code — 0 clean, 1 conflicts, 128 unrelated histories.
          set +e
          git merge-tree --write-tree HEAD FETCH_HEAD >/dev/null 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "no merge conflicts with $BASE_REF"
            exit 0
          fi
          case "$status" in
            1) printf '::error title=merge conflicts::This branch conflicts with %s. Resolve the conflicts before CI can proceed.\n' "$BASE_REF" ;;
            *) printf '::error title=conflict detection failed::git merge-tree exited %s (unrelated histories or a git error).\n' "$status" ;;
          esac
          exit "$status"
