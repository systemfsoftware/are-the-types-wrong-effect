name: CI

# One job per pull request. A pull request runs format, lint, typecheck and build on the affected packages. A Mergify queue draft (head ref
# `mergify/merge-queue/*`) and a push to main run the full command. Mergify builds its drafts as pull requests, so
# there is no merge_group trigger. The squash-message lint and the change-intent check are steps of the same job.
# A newer push to a pull request cancels its older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-ci.yml@7544b79a7f94d783ba7832bc7b07a413d5c60793
    with:
      commitlint: true
      changeset: true
      fast: pnpm format:check && export TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD" && pnpm exec turbo run typecheck typecheck:node lint attw --affected
      full: pnpm check:ci && pnpm test:e2e
