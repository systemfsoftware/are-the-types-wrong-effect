name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: ./.github/workflows/conflict-check.yml
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  require-changeset:
    name: a publishable-package change needs a changeset
    needs: conflicts
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Require a changeset for publishable-package changes
        run: ./scripts/check-changeset.ts ${{ github.event.pull_request.base.sha }}
