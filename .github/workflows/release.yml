name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@b9ff6af5b4a04281e2416ebbdf577d058404adf6
    with:
      ci-workflow: ci.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
