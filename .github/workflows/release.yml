name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: plan · derive phase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          cache-key-prefix: release
          nix: "false"
      - name: Preflight intent consumption
        run: pnpm version -r --dry-run
      - id: plan
        name: Decide release phase from repository state
        run: ./scripts/plan-release.ts --output "$GITHUB_OUTPUT"

  version:
    if: needs.plan.outputs.phase == 'version'
    needs: [plan]
    name: version · open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          cache-key-prefix: release
          nix: "false"
      - name: Consume pending change intents
        run: pnpm version -r
      - name: Capture release set
        run: ./scripts/tag-released-packages.ts --dry-run --json --output /tmp/captured.json && cat /tmp/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/create-github-releases.ts --assert --captured /tmp/captured.json
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: ./scripts/open-release-pr.sh

  publish:
    if: needs.plan.outputs.phase == 'publish'
    permissions:
      contents: write
      id-token: write
    name: publish · oidc · tag
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Deno
        uses: denoland/setup-deno@v2
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          cache-key-prefix: release
          nix: "false"
      - name: Capture release set
        run: ./scripts/tag-released-packages.ts --dry-run --json --output /tmp/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/create-github-releases.ts --assert --captured /tmp/captured.json
      - name: Build
        run: pnpm build
      - name: Publish unpublished versions via OIDC
        run: ./scripts/tag-released-packages.ts --unpublished --captured /tmp/captured.json --publish
      - name: Tag released versions
        run: ./scripts/tag-released-packages.ts --captured /tmp/captured.json
      - name: GitHub Releases from authored changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/create-github-releases.ts --captured /tmp/captured.json
