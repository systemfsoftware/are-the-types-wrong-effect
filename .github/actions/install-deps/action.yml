name: Install workspace dependencies
description: Set up the Node runtime, install the workspace from the lockfile, and restore the turbo cache.

inputs:
  frozen-lockfile:
    description: Pass --frozen-lockfile to pnpm install
    required: false
    default: "true"
  nix:
    description: Install Nix and the flake-built dprint; forwarded to setup-node-runtime
    required: false
    default: "true"
  cache-key-prefix:
    description: Lane segment of the turbo cache key; each lane saves under its own prefix and restores across all of them
    required: false
    default: "dist"

runs:
  using: composite
  steps:
    - name: Set up the Node runtime
      uses: ./.github/actions/setup-node-runtime
      with:
        nix: ${{ inputs.nix }}
    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.frozen-lockfile }}" = "true" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
    # Lockfile-keyed, not sha-keyed: a sha key can never hit, so every commit would start cold.
    - name: Cache the turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-key-prefix }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key-prefix }}-
          turbo-${{ runner.os }}-
